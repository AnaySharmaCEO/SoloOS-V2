      <stop offset="0%" stop-color="#F59E0B" /> 
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <linearGradient id="railGradient" x1="2" y1="16" x2="26" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D6A4D" />
      <stop offset="100%" stop-color="#0A523B" />
